<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="planetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark space background -->
  <rect width="100" height="100" fill="#0f172a"/>
  
  <!-- Planet -->
  <circle cx="50" cy="50" r="35" fill="url(#planetGradient)"/>
  
  <!-- Stars -->
  <circle cx="20" cy="20" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="80" cy="25" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="85" cy="75" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="15" cy="70" r="1" fill="#fbbf24" opacity="0.5"/>
  
  <!-- Ring around planet -->
  <ellipse cx="50" cy="50" rx="40" ry="12" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
</svg>